<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}EcoSort AI — Waste Segregation{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
</head>
<body>

<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

<nav class="navbar">
  <a href="{{ url_for('home') }}" class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 6v6c0 5 3.6 8.7 8 10 4.4-1.3 8-5 8-10V6l-8-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12.5l2 2 4-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>EcoSort <b>AI</b></span>
  </a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <ul class="nav-links" id="navLinks">
    <li><a href="{{ url_for('home') }}" class="{{ 'active' if request.path=='/' else '' }}">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V21h14V9.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="nav.home">Home</span></a></li>
    <li><a href="{{ url_for('detect_page') }}" class="{{ 'active' if request.path=='/detect' else '' }}">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="12" cy="12.5" r="3.4" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M8 6l1.5-2.5h5L16 6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      <span data-i18n="nav.detect">Detect</span></a></li>
    <li><a href="{{ url_for('dashboard_page') }}" class="{{ 'active' if request.path=='/dashboard' else '' }}">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span data-i18n="nav.dashboard">Dashboard</span></a></li>
    <li><a href="{{ url_for('guidelines_page') }}" class="{{ 'active' if request.path=='/guidelines' else '' }}">
      <svg viewBox="0 0 24 24"><path d="M6 4h9l3 3v13H6z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M9 10h6M9 14h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span data-i18n="nav.guidelines">Guidelines</span></a></li>
    <li><a href="{{ url_for('chatbot_page') }}" class="{{ 'active' if request.path=='/chatbot' else '' }}">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
      <span data-i18n="nav.chatbot">EcoBot</span></a></li>
    <li><a href="{{ url_for('about_page') }}" class="{{ 'active' if request.path=='/about' else '' }}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 11v6M12 7.5v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span data-i18n="nav.about">About</span></a></li>
    <li class="nav-lang">
      <select class="lang-select" aria-label="Language / भाषा"></select>
    </li>
  </ul>
</nav>

<main class="page">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p data-i18n="common.footer">EcoSort AI &middot; Class XII Computer Science Investigatory Project &middot; Built with YOLOv8 + Flask &middot; Runs fully offline &amp; under your control</p>
</footer>

<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
